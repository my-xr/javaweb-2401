server:
  port: 8081
  servlet:
    context-path: /api

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.gzu.ctts.controller

# Knife4j 增强配置
knife4j:
  enable: true                   # 开启 Knife4j
  setting:
    language: zh_cn              # 中文
    enable-version: true         # 显示版本
    enable-reload-cache: true    # 支持刷新缓存
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false
    enable-host-text: localhost:8080
    enable-home-custom: false
    home-custom-path: classpath:markdown/home.md
    enable-search: false
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Apache License 2.0 | Copyright  2024 CTTS
    enable-dynamic-parameter: false
    enable-debug: true           # 启用调试
    enable-open-api: false
    enable-group: true
  cors: false
  production: false              # 生产环境设为 true 关闭文档
  basic:
    enable: false                # 是否开启 basic 认证
    username: admin
    password: 123456

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ctts?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

# ========== MyBatis-Plus 配置 ==========
mybatis-plus:
  configuration:
    # SQL 日志输出（开发环境开启，生产关闭）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 驼峰命名映射（默认开启）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：AUTO 数据库自增
      id-type: AUTO
      # 逻辑删除（CTTS暂不启用，M5模块再启用）
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0

# ========== 日志配置 ==========
logging:
  level:
    com.ctts: debug
    com.baomidou.mybatisplus: debug


